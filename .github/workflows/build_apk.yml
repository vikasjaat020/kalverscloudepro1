name: Build Kalvers Claude Pro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Project and Fix Kotlin Nullability
      run: |
        # Subfolder se files root par copy karein
        if [ -d "kalvers_claude_pro_android" ]; then
          cp -r kalvers_claude_pro_android/* . 2>/dev/null || true
        fi
        
        # AGP 8 compatibility: manifest se redundant package tag hatayein
        sed -i 's/package="com.kalvers.claudepro"//g' app/src/main/AndroidManifest.xml || true
        
        # Environment aur resources setup
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        mkdir -p app/src/main/res/values
        echo '<resources><string name="app_name">Kalvers Claude Pro</string></resources>' > app/src/main/res/values/strings.xml
        echo '<resources><style name="Theme.KalversClaudePro" parent="Theme.AppCompat.DayNight.NoActionBar"/></resources>' > app/src/main/res/values/themes.xml
        touch app/proguard-rules.pro
        
        if [ -f "settings.gradle" ]; then
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/g' settings.gradle || true
        fi
        
        # Auto-fix Kotlin null safety in MainActivity.kt
        sed -i 's/nextAccount\./nextAccount!!\./g' app/src/main/java/com/kalvers/claudepro/MainActivity.kt || true
        sed -i 's/account\./account!!\./g' app/src/main/java/com/kalvers/claudepro/MainActivity.kt || true
        sed -i 's/return$/return@runOnUiThread/g' app/src/main/java/com/kalvers/claudepro/MainActivity.kt || true
        
        chmod +x gradlew || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Android APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kalvers_Claude_Pro_APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
