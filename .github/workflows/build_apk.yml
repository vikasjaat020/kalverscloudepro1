name: Build Kalvers Claude Pro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Android Project
      run: |
        # Flatten directory if nested inside kalvers_claude_pro_android folder
        if [ -d "kalvers_claude_pro_android" ]; then
          cp -r kalvers_claude_pro_android/* .
        fi

        # If zip is present, extract it cleanly
        if [ -f "Kalvers_Claude_Pro_Android_Source.zip" ]; then
          unzip -q -o Kalvers_Claude_Pro_Android_Source.zip -d temp_src
          if [ -d "temp_src/kalvers_claude_pro_android" ]; then
            cp -r temp_src/kalvers_claude_pro_android/* .
          else
            cp -r temp_src/* .
          fi
          rm -rf temp_src
        fi

        # Ensure all required Android resource XML files exist
        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/strings.xml
<resources>
    <string name="app_name">Kalvers Claude Pro</string>
</resources>
EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
<resources>
    <style name="Theme.KalversClaudePro" parent="Theme.AppCompat.DayNight.NoActionBar">
        <item name="android:statusBarColor">#0F172A</item>
        <item name="android:navigationBarColor">#0F172A</item>
    </style>
</resources>
EOF

        touch app/proguard-rules.pro

        # Fix repository preference in settings.gradle
        if [ -f "settings.gradle" ]; then
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/g' settings.gradle || true
        fi

        chmod +x gradlew || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kalvers_Claude_Pro_APK
        path: app/build/outputs/apk/debug/*.apk
